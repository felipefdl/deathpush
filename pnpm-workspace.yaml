packages:
  - website

allowBuilds:
  esbuild: true

autoInstallPeers: false

minimumReleaseAgeExclude:
  - '@solidjs/signals@2.0.0-rc.4'
  - '@solidjs/testing-library@1.0.0-beta.2'
  - '@solidjs/vite-plugin@3.0.0-next.35'
  - '@solidjs/web@2.0.0-rc.4'
  - solid-js@2.0.0-rc.4

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11

peerDependencyRules:
  allowedVersions:
    "@solidjs/testing-library>@solidjs/web": "2.0.0-rc.4"
    "@solidjs/testing-library>solid-js": "2.0.0-rc.4"
    "@solidjs/vite-plugin>vite": "0.3.0"
    "vitefu>vite": "0.3.0"
    "@vitest/mocker>vite": "0.3.0"
    "vitest>vite": "0.3.0"
