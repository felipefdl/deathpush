name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
    paths-ignore:
      - "website/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
          - platform: windows-11-arm
            args: "--target aarch64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils
      - run: vp install --frozen-lockfile
      - name: Lint frontend
        run: vp lint src/
      - name: Typecheck frontend
        run: vp check --no-lint src vite.config.ts
      - name: Test frontend
        run: vp test run
      - name: Clippy
        run: cd src-tauri && cargo clippy -- -D warnings
      - name: Test Rust
        run: cd src-tauri && cargo test
      - name: Build
        run: vp run tauri build --no-bundle ${{ matrix.args }}
