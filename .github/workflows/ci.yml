name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
    paths-ignore:
      - "website/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""
          - platform: windows-11-arm
            args: "--target aarch64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Enable long paths for dependency checkouts
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || '' }}
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        if: runner.os != 'Windows' || runner.arch != 'ARM64'
        with:
          version: 0.16.0
      - name: Install x64 Zig on Windows ARM
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: ./.github/scripts/setup-zig-windows-arm.ps1
      - uses: swatinem/rust-cache@v2
      - name: Install Linux deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libssl-dev libzstd-dev
      - name: Format
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.args }} -- -D warnings
      - name: Test
        run: cargo test --workspace ${{ matrix.args }}
      - name: Build
        run: cargo build --release -p deathpush ${{ matrix.args }}
